name: Publish to Comfy registry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v2.0.0
        required: true
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'FallenIncursio' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from aec_link_version import VERSION
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != VERSION or tag != project:
              raise SystemExit(f"version mismatch: tag={tag}, runtime={VERSION}, project={project}")
          PY

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: true
